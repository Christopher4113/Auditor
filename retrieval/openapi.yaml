openapi: 3.1.0
info:
  title: Auditor retrieval
  description: Phase 1 fixture service. Queries return canned citations, indexing
    does not persist, statistics are placeholders, and CRS verification is unavailable.
  version: 0.1.0
paths:
  /index:
    post:
      summary: Index
      operationId: index_index_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Chunk'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Index Index Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /query:
    post:
      summary: Query
      operationId: query_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Query'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Hit'
                type: array
                title: Response Query Query Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /stats:
    get:
      summary: Stats
      operationId: stats_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Stats Stats Get
  /verify:
    post:
      summary: Verify
      operationId: verify_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Chunk:
      properties:
        collection:
          type: string
          minLength: 1
          pattern: \S
          title: Collection
        id:
          type: string
          minLength: 1
          pattern: \S
          title: Id
        text:
          type: string
          minLength: 1
          pattern: \S
          title: Text
        meta:
          additionalProperties: true
          type: object
          title: Meta
      type: object
      required:
      - collection
      - id
      - text
      title: Chunk
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Hit:
      properties:
        id:
          type: string
          title: Id
        text:
          type: string
          title: Text
        score:
          type: number
          title: Score
      type: object
      required:
      - id
      - text
      - score
      title: Hit
    Query:
      properties:
        collection:
          type: string
          minLength: 1
          pattern: \S
          title: Collection
        text:
          type: string
          minLength: 1
          pattern: \S
          title: Text
        k:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: K
          default: 3
      type: object
      required:
      - collection
      - text
      title: Query
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VerifyRequest:
      properties:
        testIdentityId:
          type: string
          minLength: 1
          pattern: \S
          title: Testidentityid
      type: object
      required:
      - testIdentityId
      title: VerifyRequest
    VerifyResult:
      properties:
        identityMatch:
          type: boolean
          title: Identitymatch
        fraudFlags:
          items:
            type: string
          type: array
          title: Fraudflags
        available:
          type: boolean
          title: Available
      type: object
      required:
      - identityMatch
      - fraudFlags
      - available
      title: VerifyResult

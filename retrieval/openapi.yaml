openapi: 3.1.0
info:
  title: Auditor retrieval
  description: Phase 2 persistent policy/contract and runtime decision/correction
    retrieval. Entity-scoped snapshot reset and CRS sandbox verification fail closed.
    Backend and measured counters are in /stats.
  version: 0.3.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /index:
    post:
      summary: Index
      operationId: index_index_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Chunk'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Index Index Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /index/batch:
    post:
      summary: Index Batch
      operationId: index_batch_index_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Batch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Index Batch Index Batch Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /query:
    post:
      summary: Query
      operationId: query_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Query'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Hit'
                type: array
                title: Response Query Query Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /reindex-all:
    post:
      summary: Reindex All
      description: Replace one entity's complete snapshot, including runtime memory.
        Other entities are preserved. Empty chunks clears this entity. Send only authoritative
        policy, contracts and reviewed memory; never the answer key.
      operationId: reindex_all_reindex_all_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reindex'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Reindex All Reindex All Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /resolve:
    post:
      summary: Resolve
      operationId: resolve_resolve_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resolve'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Resolve Resolve Post
        '404':
          description: Source unavailable in the requested entity/date scope
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /stats:
    get:
      summary: Stats
      operationId: stats_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Stats Stats Get
      security:
      - HTTPBearer: []
  /verify:
    post:
      summary: Verify
      operationId: verify_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    Batch:
      properties:
        chunks:
          items:
            $ref: '#/components/schemas/Chunk'
          type: array
          maxItems: 100
          minItems: 1
          title: Chunks
      type: object
      required:
      - chunks
      title: Batch
    Chunk:
      properties:
        collection:
          type: string
          enum:
          - policy
          - contracts
          - decisions
          - corrections
          title: Collection
        id:
          type: string
          maxLength: 200
          minLength: 1
          pattern: \S
          title: Id
        text:
          type: string
          maxLength: 20000
          minLength: 1
          pattern: \S
          title: Text
        meta:
          additionalProperties: true
          type: object
          title: Meta
      type: object
      required:
      - collection
      - id
      - text
      title: Chunk
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Hit:
      properties:
        id:
          type: string
          title: Id
        text:
          type: string
          title: Text
        score:
          type: number
          title: Score
      type: object
      required:
      - id
      - text
      - score
      title: Hit
    Query:
      properties:
        collection:
          type: string
          enum:
          - policy
          - contracts
          - decisions
          - corrections
          title: Collection
        text:
          type: string
          maxLength: 4000
          minLength: 1
          pattern: \S
          title: Text
        k:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: K
          default: 3
        entity:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9_-]{1,80}$
          - type: 'null'
          title: Entity
        asOf:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Asof
      type: object
      required:
      - collection
      - text
      title: Query
    Reindex:
      properties:
        entity:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,80}$
          title: Entity
        chunks:
          items:
            $ref: '#/components/schemas/Chunk'
          type: array
          maxItems: 1000
          title: Chunks
        resetCounters:
          type: boolean
          title: Resetcounters
          default: false
      type: object
      required:
      - entity
      - chunks
      title: Reindex
    Resolve:
      properties:
        collection:
          type: string
          enum:
          - policy
          - contracts
          - decisions
          - corrections
          title: Collection
        id:
          type: string
          maxLength: 200
          minLength: 1
          title: Id
        entity:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9_-]{1,80}$
          - type: 'null'
          title: Entity
        asOf:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Asof
      type: object
      required:
      - collection
      - id
      title: Resolve
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VerifyRequest:
      properties:
        testIdentityId:
          type: string
          minLength: 1
          pattern: \S
          title: Testidentityid
        includeReport:
          type: boolean
          title: Includereport
          default: false
      type: object
      required:
      - testIdentityId
      title: VerifyRequest
    VerifyResult:
      properties:
        identityMatch:
          type: boolean
          title: Identitymatch
        fraudFlags:
          items:
            type: string
          type: array
          title: Fraudflags
        available:
          type: boolean
          title: Available
        report:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Report
      type: object
      required:
      - identityMatch
      - fraudFlags
      - available
      title: VerifyResult
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

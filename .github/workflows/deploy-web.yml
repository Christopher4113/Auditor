# Every push to main deploys convex/ to the prod Convex deployment, then rebuilds the dashboard against it and
# publishes it to Vercel (project "auditor", alias https://auditor-nine-ecru.vercel.app). Secrets:
#   CONVEX_DEPLOY_KEY  production deploy key (Convex dashboard -> Settings -> Deploy keys)
#   VERCEL_TOKEN       from https://vercel.com/account/tokens
# Both stored with `gh secret set <NAME>`. The ids below are not secret.
name: Deploy
on:
  push:
    branches: [main]
    paths: [web/**, convex/**, package.json, pnpm-lock.yaml, .github/workflows/deploy-web.yml]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_GysUhXOIF8Z6I69GGqfk2K1Q
      VERCEL_PROJECT_ID: prj_53xM7TeBFqkhYSkHmUwvsaRQ3s1l
      CONVEX_URL: https://tough-shepherd-182.convex.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx convex deploy --yes
        env: { CONVEX_DEPLOY_KEY: "${{ secrets.CONVEX_DEPLOY_KEY }}" }
      - run: pnpm --filter web build
      - run: npx vercel@65 deploy web/dist --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
